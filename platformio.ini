[platformio]
default_envs = heltec_v2

[env:heltec_v2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
extra_scripts = pre:scripts/inject_mesh_psk.py

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DFW_VERSION=\"1.0.1\"
    ; LoRa mesh: Meshtastic-compatible private channel. The repeater and every tracker of one
    ; organisation need the same channel name and key. The key is set per device on the settings
    ; page and kept across updates. Optionally MESH_PSK_B64 (environment or gitignored .env) is
    ; built in as the key for devices that have none stored yet. Anything built in is readable
    ; from the binary, so never publish such builds.
    -DMESH_CHANNEL_NAME=\"UAV-BOS\"

lib_deps =
    jgromes/RadioLib@^7.1.2
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9
